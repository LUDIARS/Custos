<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Custos — Remote Test Runner</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="title">CUSTOS <span class="subtitle">remote test runner</span></div>
    <div class="header-controls">
      <select id="appSelect" aria-label="アプリ選択">
        <option value="">— 起動対象を選択 —</option>
      </select>
      <button id="btnBuild" class="action build" disabled>Build</button>
      <button id="btnRun"   class="action run"   disabled>Run</button>
      <button id="btnTest"  class="action test"  disabled>Test</button>
      <button id="btnKill"  class="action kill"  disabled>Kill</button>
      <span class="status-pill" id="statusPill" data-state="idle">idle</span>
    </div>
  </header>

  <!-- ─── メインタブバー (Build 行のすぐ下) ──────────────── -->
  <nav class="main-tabs" role="tablist" aria-label="メインビュー切替">
    <button class="main-tab active" data-tab="view"  role="tab" aria-selected="true"  id="mainTabView">VIEW</button>
    <button class="main-tab"        data-tab="logs"  role="tab" aria-selected="false" id="mainTabLogs">LOG</button>
    <button class="main-tab"        data-tab="tests" role="tab" aria-selected="false" id="mainTabTests">TEST</button>
    <span class="main-tabs-spacer"></span>
    <button id="btnClearOutput" class="ghost" type="button">Clear</button>
  </nav>

  <main class="layout">

    <!-- ─── VIEW タブ (配信 + バーチャルキー) ───────── -->
    <section class="main-panel active" data-tab="view" id="panelView">
      <div class="view-grid">
        <!-- 配信領域 -->
        <section class="stream-area" aria-label="アプリ画面">
          <div class="stream-frame" id="streamFrame">
            <video id="streamVideo" autoplay playsinline muted></video>
            <img   id="streamImage" alt="latest screenshot" />
            <div class="stream-placeholder" id="streamPlaceholder">
              <div class="ph-title">No capture yet</div>
              <div class="ph-hint">下の Capture セクションから「📷 Capture」または「▶ Stream」を押してください</div>
            </div>
          </div>
        </section>

        <!-- 仮想キー + Capture コントロール -->
        <section class="virtual-keys" aria-label="バーチャルキー">
          <div class="vk-toolbar">
            <span class="vk-label">Virtual Keys</span>
            <span class="vk-hint">アプリに直接入力されます</span>
            <span class="vk-toolbar-spacer"></span>
            <label class="capture-mode-label">
              Capture
              <select id="captureMode" aria-label="キャプチャモード">
                <option value="snapshot">Snapshot</option>
                <option value="webrtc">Realtime (WebRTC)</option>
              </select>
            </label>
            <button id="btnSnapshot"    class="ghost capture-action mode-snapshot" type="button" title="1 フレーム取得 (curl で /api/apps/:id/screenshot を叩いても同じ PNG が取れる)">📷 Capture</button>
            <button id="btnStreamStart" class="ghost capture-action mode-webrtc"   type="button" hidden>▶ Stream</button>
            <button id="btnStreamStop"  class="ghost capture-action mode-webrtc"   type="button" hidden>⏹ Stop</button>
            <a id="btnDownload" class="ghost capture-action" href="#" download hidden>⬇</a>
          </div>
          <div class="vk-grid" id="vkGrid">
            <div class="vk-empty">アプリを選択するとバーチャルキーが表示されます。</div>
          </div>
        </section>
      </div>
    </section>

    <!-- ─── LOG タブ ─────────────────────────────── -->
    <section class="main-panel" data-tab="logs" id="panelLogs">
      <pre class="log-stream" id="logStream"></pre>
    </section>

    <!-- ─── TEST タブ ────────────────────────────── -->
    <section class="main-panel" data-tab="tests" id="panelTests">
      <pre class="log-stream" id="testStream"></pre>
    </section>

  </main>

  <footer class="app-footer">
    <span id="wsStatus" class="ws-status disconnected">WS disconnected</span>
    <span class="grow"></span>
    <span class="hint">Custos v0.1.0</span>
  </footer>

  <!-- 同 origin 構成: API も WS も /api/* / /ws の相対 URL で叩ける。 -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
