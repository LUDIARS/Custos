# Custos の Excubitor catalog (サービス定義の正本。Excubitor/catalog/FRAGMENTS.md)。
# 単一 Hono アプリを 2 ポートで listen する (src/main.ts / dev-process.md):
#   - backend  7676 (CUSTOS_PORT。`port` から Excubitor が自動で注入する)
#   - frontend 4649 (CUSTOS_FRONTEND_PORT。`ports` で宣言)
# 任意コマンド実行・入力注入・画面取得ができるため loopback のまま公開しない (dev-process.md)。
services:
  - code: custos
    name: Custos (リモートテストランナー)
    tier: personal
    project_code: custos
    component: server
    port: 7676
    ports:
      - role: frontend
        port: 4649
        env: CUSTOS_FRONTEND_PORT
    repo: LUDIARS/Custos
    # 起動コマンドは dev-process.md の bash ブロック (npm run serve)。
    runtime: dev-process-md
    cwd: ${ARS_ROOT}/Custos
    autostart: false
    restart_policy: "no"
    health:
      type: http
      # health は /api/health (/health ではない)。
      url: http://127.0.0.1:7676/api/health
      interval_sec: 30
      grace_period_sec: 10
    provides:
      CUSTOS_URL: http://127.0.0.1:${port}
